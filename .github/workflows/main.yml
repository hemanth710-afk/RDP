name: RDP and Persistent Storage

on:
  workflow_dispatch:

jobs:
  secure-rdp-and-storage:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Discover Machine Resources
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $cs = Get-CimInstance Win32_ComputerSystem
          $proc = Get-CimInstance Win32_Processor
          $cDrive = Get-PSDrive C

          Write-Host "=== CURRENT MACHINE RESOURCE REPORT ==="
          Write-Host "OS: $($os.Caption)"
          Write-Host "Build: $($os.BuildNumber)"
          Write-Host "Hostname: $($cs.Name)"
          Write-Host "CPU: $($proc.Name)"
          Write-Host "Physical Cores: $($proc.NumberOfCores)"
          Write-Host "Logical Processors: $($proc.NumberOfLogicalProcessors)"
          Write-Host "Total RAM: $([math]::Round($os.TotalVisibleMemorySize / 1MB, 2)) GB"
          Write-Host "Available RAM: $([math]::Round($os.FreePhysicalMemory / 1MB, 2)) GB"
          Write-Host "C: Total: $([math]::Round(($cDrive.Used + $cDrive.Free) / 1GB, 2)) GB"
          Write-Host "C: Free: $([math]::Round($cDrive.Free / 1GB, 2)) GB"
          Write-Host "========================================"

      - name: Configure Secure RDP Settings
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force

          # Enable Network Level Authentication (NLA) and TLS Layer 2
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 2 -Force

          # Restrict firewall strictly to Tailscale CGNAT IP space (100.64.0.0/10) - NEVER open 3389 publicly
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

          Restart-Service -Name TermService -Force

      - name: Create / Configure RDP User Securely
        run: |
          $password = "${{ secrets.RDP_PASSWORD }}"
          if (-not $password) {
              Write-Error "RDP_PASSWORD secret is missing. Please set RDP_PASSWORD in GitHub Repository Secrets."
              exit 1
          }

          # Mask password from all workflow output logs
          Write-Output "::add-mask::$password"

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          } else {
              Set-LocalUser -Name "RDP" -Password $securePass
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
          
          # Pass securely into GITHUB_ENV as a masked variable
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV
          Write-Host "RDP user configured securely (credential is masked)."

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Connect Tailscale
        run: |
          # Bring up Tailscale and grant operator permission to RDP user
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID `
            --operator=RDP
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Runner Tailscale IP: $tsIP"

      - name: Test Network and SMB Connectivity to Machine A
        run: |
          $storageHost = "100.93.61.9"
          Write-Host "Testing ping to Storage Host $storageHost..."
          & "$env:ProgramFiles\Tailscale\tailscale.exe" ping --c 3 $storageHost

          Write-Host "Testing SMB TCP port 445 on $storageHost..."
          $portTest = Test-NetConnection $storageHost -Port 445
          if (-not $portTest.TcpTestSucceeded) {
              Write-Error "TCP port 445 to Storage Host failed! Ensure Machine A is powered on and Tailscale is running."
              exit 1
          }
          Write-Host "TCP port 445 connection successful!"

      - name: Mount Persistent Storage (P:) and Configure Interactive Logon
        run: |
          $storageUser = "NASTYKNIGHT\StorageUser"
          $storagePass = "${{ secrets.STORAGE_PASSWORD }}"
          $rdpPassStr = "${{ secrets.RDP_PASSWORD }}"

          if (-not $storagePass -or -not $rdpPassStr) {
              Write-Error "Missing STORAGE_PASSWORD or RDP_PASSWORD secrets."
              exit 1
          }
          Write-Output "::add-mask::$storagePass"
          Write-Output "::add-mask::$rdpPassStr"

          $share = "\\100.93.61.9\PersistentStorage"

          # 1. Store credentials for the RDP user via Credential Manager
          Write-Host "Storing SMB credentials for RDP user..."
          $rdpSecure = ConvertTo-SecureString $rdpPassStr -AsPlainText -Force
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "cmdkey.exe"
          $psi.Arguments = "/add:100.93.61.9 /user:`"$storageUser`" /pass:`"$storagePass`""
          $psi.UserName = "RDP"
          $psi.Domain = "."
          $psi.Password = $rdpSecure
          $psi.UseShellExecute = $false
          $psi.LoadUserProfile = $true
          $psi.WorkingDirectory = "C:\"
          $process = [System.Diagnostics.Process]::Start($psi)
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) {
              Write-Error "Failed to store credentials using cmdkey for RDP user."
          } else {
              Write-Host "Credentials stored successfully in Windows Credential Manager for RDP user."
          }

          # 2. Mount P: drive in current runner session
          Write-Host "Connecting SMB share $share for runner..."
          cmdkey.exe /add:100.93.61.9 /user:"$storageUser" /pass:"$storagePass" | Out-Null
          net use P: $share /persistent:yes
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to map P: drive via net use."
              exit 1
          }
          Write-Host "P: drive successfully mapped to $share"

          # 3. Configure per-user automatic drive mapping for interactive RDP desktop sessions
          $startupDir = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp"
          $logonScript = @"
@echo off
net use P: $share /persistent:yes >nul 2>&1
"@
          Set-Content -Path "$startupDir\MapPDrive.bat" -Value $logonScript -Encoding ASCII
          Write-Host "Configured interactive desktop logon mapping script (no password embedded)."

      - name: Verify Persistent Directories on P:
        run: |
          $requiredDirs = @("AI_EDITOR", "Videos", "Assets", "Projects", "Backups")
          $missing = @()
          foreach ($dir in $requiredDirs) {
              $path = "P:\$dir"
              if (Test-Path $path) {
                  Write-Host "Verified directory: $path"
              } else {
                  Write-Host "MISSING directory: $path" -ForegroundColor Red
                  $missing += $path
              }
          }
          if ($missing.Count -gt 0) {
              Write-Error "One or more required directories missing on P: ($($missing -join ', '))"
              exit 1
          }
          Write-Host "All persistent directories successfully verified on physical USB storage!"

      - name: Storage Operations Proof & Persistence Test
        run: |
          # Phase 7 & 8: Temporary read / write / modify / rename verification
          $testFile = "P:\ANTIGRAVITY_PENDRIVE_TEST.txt"
          Set-Content -Path $testFile -Value "DIRECT_USB_STORAGE_TEST"
          $readBack = Get-Content -Path $testFile
          if ($readBack -ne "DIRECT_USB_STORAGE_TEST") {
              Write-Error "Read/write test failed!"
              exit 1
          }
          Write-Host "Direct write and read verified on P:"

          # Rename test
          $renamedFile = "P:\ANTIGRAVITY_PENDRIVE_TEST_RENAMED.txt"
          Rename-Item -Path $testFile -NewName "ANTIGRAVITY_PENDRIVE_TEST_RENAMED.txt"
          if (-not (Test-Path $renamedFile)) {
              Write-Error "Rename test failed!"
              exit 1
          }
          Write-Host "Rename verified on P:"
          Remove-Item -Path $renamedFile -Force
          Write-Host "Temporary test files cleaned up successfully."

          # Phase 17: Persistence Test Marker
          $persistFile = "P:\Projects\PersistenceTest.txt"
          Set-Content -Path $persistFile -Value "RUN_1_PERSISTENCE_TEST"
          Write-Host "Persistence marker created at $persistFile"

      - name: Maintain RDP Session
        run: |
          Write-Host "`n=== SECURE RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Port: 3389 (Accessible strictly over Tailscale)"
          Write-Host "Username: RDP"
          Write-Host "NLA: Enabled (Secure TLS)"
          Write-Host "Storage Mapping: P: -> \\100.93.61.9\PersistentStorage (Physical USB)"
          Write-Host "========================`n"

          # Keep runner active
          while ($true) {
              Write-Host "[$(Get-Date)] Runner active - Tailscale & P: drive online"
              Start-Sleep -Seconds 300
          }

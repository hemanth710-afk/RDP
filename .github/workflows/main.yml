name: RDP and Persistent Storage

on:
  workflow_dispatch:

jobs:
  secure-rdp-and-storage:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Discover Machine Resources
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $cs = Get-CimInstance Win32_ComputerSystem
          $proc = Get-CimInstance Win32_Processor
          $cDrive = Get-PSDrive C

          Write-Host "=== CURRENT MACHINE RESOURCE REPORT ==="
          Write-Host "OS: $($os.Caption)"
          Write-Host "Build: $($os.BuildNumber)"
          Write-Host "Hostname: $($cs.Name)"
          Write-Host "CPU: $($proc.Name)"
          Write-Host "Physical Cores: $($proc.NumberOfCores)"
          Write-Host "Logical Processors: $($proc.NumberOfLogicalProcessors)"
          Write-Host "Total RAM: $([math]::Round($os.TotalVisibleMemorySize / 1MB, 2)) GB"
          Write-Host "Available RAM: $([math]::Round($os.FreePhysicalMemory / 1MB, 2)) GB"
          Write-Host "C: Total: $([math]::Round(($cDrive.Used + $cDrive.Free) / 1GB, 2)) GB"
          Write-Host "C: Free: $([math]::Round($cDrive.Free / 1GB, 2)) GB"
          Write-Host "========================================"

      - name: Configure Secure RDP Settings
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force

          # Enable Network Level Authentication (NLA) and TLS Layer 2
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 2 -Force

          # Restrict firewall strictly to Tailscale CGNAT IP space (100.64.0.0/10) - NEVER open 3389 publicly
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

          Restart-Service -Name TermService -Force

      - name: Create / Configure RDP User Securely
        run: |
          $password = "${{ secrets.RDP_PASSWORD }}"
          if (-not $password) {
              Write-Error "RDP_PASSWORD secret is missing. Please set RDP_PASSWORD in GitHub Repository Secrets."
              exit 1
          }

          # Mask password from all workflow output logs
          Write-Output "::add-mask::$password"

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          } else {
              Set-LocalUser -Name "RDP" -Password $securePass
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
          
          # Pass securely into GITHUB_ENV as a masked variable
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV
          Write-Host "RDP user configured securely (credential is masked)."

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Connect Tailscale
        run: |
          # Bring up Tailscale in unattended mode
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID `
            --unattended
          
          # Verify Tailscale status
          & "$env:ProgramFiles\Tailscale\tailscale.exe" status

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP -or $tsIP -notmatch "^100\.") {
              Write-Error "Tailscale IP not assigned or not a valid 100.x address. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Runner Tailscale IP: $tsIP"

      - name: Test Network and SMB Connectivity to Machine A
        run: |
          $storageHost = "100.93.61.9"
          Write-Host "Testing ping to Storage Host $storageHost..."
          $pingOutput = cmd.exe /c "`"$env:ProgramFiles\Tailscale\tailscale.exe`" ping --c 3 $storageHost 2>&1" | Out-String
          $pingExitCode = $LASTEXITCODE

          Write-Host $pingOutput
          Write-Host "Tailscale ping exit code: $pingExitCode"

          if ($pingOutput -match "via DERP" -or $pingOutput -match "relay") {
              Write-Host "Path type: DERP/relay"
          } elseif ($pingOutput -match "direct") {
              Write-Host "Path type: direct"
          } else {
              Write-Host "Path type: unknown"
          }

          Write-Host "Testing SMB TCP port 445 on $storageHost..."
          $portTest = Test-NetConnection $storageHost -Port 445
          
          if ($portTest.TcpTestSucceeded) {
              Write-Host "Tailscale connectivity: PASS"
              Write-Host "SMB TCP 445: PASS"
              $global:LASTEXITCODE = 0
              exit 0
          } else {
              Write-Error "TCP port 445 to Storage Host failed! Ensure Machine A is powered on and Tailscale is running."
              exit 1
          }

      - name: Mount Persistent Storage (P:) and Configure Interactive Logon
        run: |
          $storageUser = "NASTYKNIGHT\StorageUser"
          $storagePass = "${{ secrets.STORAGE_PASSWORD }}"
          $rdpPassStr = "${{ secrets.RDP_PASSWORD }}"

          if (-not $storagePass -or -not $rdpPassStr) {
              Write-Error "Missing STORAGE_PASSWORD or RDP_PASSWORD secrets."
              exit 1
          }
          Write-Output "::add-mask::$storagePass"
          Write-Output "::add-mask::$rdpPassStr"

          $share = "\\100.93.61.9\PersistentStorage"

          # 1. Store credentials for the RDP user via Credential Manager
          Write-Host "Storing SMB credentials for RDP user..."
          $rdpSecure = ConvertTo-SecureString $rdpPassStr -AsPlainText -Force
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "cmdkey.exe"
          $psi.Arguments = "/add:100.93.61.9 /user:`"$storageUser`" /pass:`"$storagePass`""
          $psi.UserName = "RDP"
          $psi.Domain = "."
          $psi.Password = $rdpSecure
          $psi.UseShellExecute = $false
          $psi.LoadUserProfile = $true
          $psi.WorkingDirectory = "C:\"
          $process = [System.Diagnostics.Process]::Start($psi)
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) {
              Write-Error "Failed to store credentials using cmdkey for RDP user."
          } else {
              Write-Host "Credentials stored successfully in Windows Credential Manager for RDP user."
          }

          # 2. Mount P: drive in current runner session
          Write-Host "Connecting SMB share $share for runner..."
          cmdkey.exe /add:100.93.61.9 /user:"$storageUser" /pass:"$storagePass" | Out-Null
          net use P: $share /persistent:yes
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to map P: drive via net use."
              exit 1
          }
          Write-Host "P: drive successfully mapped to $share"

          # 3. Configure per-user automatic drive mapping for interactive RDP desktop sessions
          $startupDir = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp"
          $logonScript = "@echo off`r`nnet use P: $share /persistent:yes >nul 2>&1"
          Set-Content -Path "$startupDir\MapPDrive.bat" -Value $logonScript -Encoding ASCII
          Write-Host "Configured interactive desktop logon mapping script (no password embedded)."

      - name: "Verify Persistent Directories on P:"
        run: |
          $requiredDirs = @("AI_EDITOR", "Videos", "Assets", "Projects", "Backups")
          $missing = @()
          foreach ($dir in $requiredDirs) {
              $path = "P:\$dir"
              if (Test-Path $path) {
                  Write-Host "Verified directory: $path"
              } else {
                  Write-Host "MISSING directory: $path" -ForegroundColor Red
                  $missing += $path
              }
          }
          if ($missing.Count -gt 0) {
              Write-Error "One or more required directories missing on P: ($($missing -join ', '))"
              exit 1
          }
          Write-Host "All persistent directories successfully verified on physical USB storage!"

      - name: Storage Operations Proof & Persistence Test
        run: |
          # Phase 7 & 8: Temporary read / write / modify / rename verification
          $testFile = "P:\ANTIGRAVITY_PENDRIVE_TEST.txt"
          Set-Content -Path $testFile -Value "DIRECT_USB_STORAGE_TEST"
          $readBack = Get-Content -Path $testFile
          if ($readBack -ne "DIRECT_USB_STORAGE_TEST") {
              Write-Error "Read/write test failed!"
              exit 1
          }
          Write-Host "Direct write and read verified on P:"

          # Rename test
          $renamedFile = "P:\ANTIGRAVITY_PENDRIVE_TEST_RENAMED.txt"
          Rename-Item -Path $testFile -NewName "ANTIGRAVITY_PENDRIVE_TEST_RENAMED.txt"
          if (-not (Test-Path $renamedFile)) {
              Write-Error "Rename test failed!"
              exit 1
          }
          Write-Host "Rename verified on P:"
          Remove-Item -Path $renamedFile -Force
          Write-Host "Temporary test files cleaned up successfully."

          # Phase 17: Persistence Test Marker
          $persistFile = "P:\Projects\PersistenceTest.txt"
          Set-Content -Path $persistFile -Value "RUN_1_PERSISTENCE_TEST"
          Write-Host "Persistence marker created at $persistFile"

      - name: Fast Start Desktop Preparation & RDP Readiness
        run: |
          Write-Host "=== PREPARING FAST START WORKSTATION ==="

          # Determine RDP profile path
          $rdpProfile = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\*" -ErrorAction SilentlyContinue |
              Where-Object { $_.ProfileImagePath -match "\\RDP$" }).ProfileImagePath
          if (-not $rdpProfile) { $rdpProfile = "C:\Users\RDP" }

          $publicDesktop = "C:\Users\Public\Desktop"
          $rdpDesktop = "$rdpProfile\Desktop"
          $desktopDirs = @($publicDesktop)
          if (Test-Path $rdpDesktop) { $desktopDirs += $rdpDesktop }

          # 1. Create desktop shortcuts to permanent P: storage (ZERO-COPY)
          Write-Host "Creating desktop shortcuts to permanent P: storage..."
          $wshShell = New-Object -ComObject WScript.Shell

          $pShortcuts = @(
              @{ Name = "Persistent Storage (P).lnk"; Target = "P:\" },
              @{ Name = "AI_EDITOR (P).lnk";         Target = "P:\AI_EDITOR" },
              @{ Name = "Projects (P).lnk";          Target = "P:\Projects" },
              @{ Name = "Videos (P).lnk";            Target = "P:\Videos" },
              @{ Name = "Assets (P).lnk";            Target = "P:\Assets" },
              @{ Name = "Backups (P).lnk";           Target = "P:\Backups" }
          )

          foreach ($dt in $desktopDirs) {
              if (-not (Test-Path $dt)) { New-Item -ItemType Directory -Path $dt -Force | Out-Null }
              foreach ($sc in $pShortcuts) {
                  if (Test-Path $sc.Target) {
                      $link = $wshShell.CreateShortcut("$dt\$($sc.Name)")
                      $link.TargetPath = $sc.Target
                      $link.Description = "Persistent USB storage: $($sc.Target)"
                      $link.Save()
                  }
              }
          }

          # 2. Stage Optional Full Restoration Script on Desktop for On-Demand Use
          Write-Host "Staging optional full restoration launcher on desktop..."
          $toolsDir = "C:\ProgramData\Workstation"
          if (-not (Test-Path $toolsDir)) { New-Item -ItemType Directory -Path $toolsDir -Force | Out-Null }
          if (Test-Path ".github\scripts\Restore-Workstation.ps1") {
              Copy-Item ".github\scripts\Restore-Workstation.ps1" -Destination "$toolsDir\Restore-Workstation.ps1" -Force
          }

          $restoreBatLines = @(
              "@echo off",
              "title Optional Full Workstation Restoration",
              "echo ======================================================",
              "echo    OPTIONAL FULL WORKSTATION RESTORATION",
              "echo ======================================================",
              "echo.",
              "echo This will restore Winget applications, Python/Node packages,",
              "echo and AppData settings from P:\WorkstationState.",
              "echo.",
              "echo Press any key to begin restoration...",
              "pause",
              "powershell.exe -NoProfile -ExecutionPolicy Bypass -File `"$toolsDir\Restore-Workstation.ps1`"",
              "echo.",
              "echo Restoration process finished. Check Desktop for report.",
              "pause"
          )
          $restoreBatContent = $restoreBatLines -join "`r`n"
          foreach ($dt in $desktopDirs) {
              Set-Content -Path "$dt\Run-Full-Restore.bat" -Value $restoreBatContent -Encoding ASCII
          }

          # 3. Apply Lightweight Personalization if Present (Wallpaper & Theme)
          $rdpAppData = "$rdpProfile\AppData\Roaming"
          $startupDir = "$rdpAppData\Microsoft\Windows\Start Menu\Programs\Startup"
          if (-not (Test-Path $startupDir)) { New-Item -ItemType Directory -Path $startupDir -Force | Out-Null }
          $statePath = "P:\WorkstationState"
          if ((Test-Path "$statePath\WindowsSettings\Personalize.reg") -or (Test-Path "$statePath\WindowsSettings\Wallpaper.jpg")) {
              $ps1Lines = @(
                  '`$sp = "P:\WorkstationState"',
                  'if (Test-Path "`$sp\WindowsSettings\Personalize.reg") {',
                  '    & reg import "`$sp\WindowsSettings\Personalize.reg" | Out-Null',
                  '}',
                  'if (Test-Path "`$sp\WindowsSettings\Wallpaper.jpg") {',
                  '    Copy-Item "`$sp\WindowsSettings\Wallpaper.jpg" -Destination "`$env:APPDATA\Wallpaper.jpg" -Force',
                  '    Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name Wallpaper -Value "`$env:APPDATA\Wallpaper.jpg"',
                  '    rundll32.exe user32.dll,UpdatePerUserSystemParameters',
                  '}',
                  'Remove-Item "`$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\RestorePersonalization.bat" -Force -ErrorAction SilentlyContinue',
                  'Remove-Item "`$PSCommandPath" -Force -ErrorAction SilentlyContinue'
              )
              $ps1Content = $ps1Lines -join "`r`n"
              Set-Content -Path "$startupDir\RestorePersonalization.ps1" -Value $ps1Content
              Set-Content -Path "$startupDir\RestorePersonalization.bat" -Value "powershell.exe -WindowStyle Hidden -ExecutionPolicy Bypass -File `"%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup\RestorePersonalization.ps1`""
              Write-Host "Lightweight wallpaper/theme queued for interactive RDP login."
          }

          # 4. Generate Fast Start Report on Desktop
          $fastStartLines = @(
              "=== WORKSTATION FAST START REPORT ===",
              "Timestamp: $(Get-Date)",
              "Mode: FAST START (Zero-Copy Startup)",
              "",
              "RDP Access: READY",
              "Tailscale IP: $env:TAILSCALE_IP",
              "Persistent P: Drive: CONNECTED (\\100.93.61.9\PersistentStorage)",
              "Desktop Shortcuts: CREATED (P:\, AI_EDITOR, Projects, Videos, Assets, Backups)",
              "Background Checkpoint: ACTIVE (15-minute background loop)",
              "",
              "FULL WORKSTATION RESTORE STATUS:",
              "Skipped on startup for fast RDP availability.",
              "Run 'Run-Full-Restore.bat' on the Desktop anytime to install",
              "Winget apps, Python/Node packages, and AppData."
          )
          $fastStartReport = $fastStartLines -join "`r`n"
          Set-Content -Path "$publicDesktop\Workstation-Startup-Report.txt" -Value $fastStartReport

          # Ensure step exits cleanly
          $global:LASTEXITCODE = 0
          Write-Host "Fast Start Desktop Preparation Complete!"

      - name: Maintain RDP Session & Checkpoint Loop
        run: |
          Write-Host "`n================================================="
          Write-Host "  === SECURE RDP ACCESS READY (FAST START) ==="
          Write-Host "================================================="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Port: 3389 (Strictly Tailscale CGNAT 100.64.0.0/10)"
          Write-Host "Username: RDP"
          Write-Host "NLA: Enabled (Secure TLS Layer 2)"
          Write-Host "Permanent Storage: P: -> \\100.93.61.9\PersistentStorage"
          Write-Host "Desktop Shortcuts: P:\, AI_EDITOR, Projects, Videos, Assets, Backups"
          Write-Host "Optional Full Restore: Double-click 'Run-Full-Restore.bat' on Desktop"
          Write-Host "=================================================`n"

          $checkpointScript = "$PWD\.github\scripts\Checkpoint-Workstation.ps1"

          # Start background checkpoint loop immediately (non-blocking)
          $checkpointPid = $null
          if (Test-Path $checkpointScript) {
              Write-Host "Launching background checkpoint loop (every 15 minutes)..."
              $proc = Start-Process powershell.exe `
                  -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$checkpointScript`" -Loop -IntervalSeconds 900" `
                  -WindowStyle Hidden -PassThru
              $checkpointPid = $proc.Id
              Write-Host "Background checkpoint process started (PID: $checkpointPid)."
          } else {
              Write-Host "WARNING: Checkpoint script not found. Background checkpointing disabled."
          }

          $statePath = "P:\WorkstationState"
          $heartbeatFile = "$statePath\Checkpoints\heartbeat.json"
          $restartedCheckpoint = $false

          # Keep runner active and monitor checkpoint health
          while ($true) {
              Write-Host "[$(Get-Date)] Runner active - Tailscale & P: drive online"

              if ($checkpointPid -and (Test-Path $checkpointScript)) {
                  $alive = Get-Process -Id $checkpointPid -ErrorAction SilentlyContinue
                  if (-not $alive) {
                      if (-not $restartedCheckpoint) {
                          Write-Host "WARNING: Checkpoint process (PID $checkpointPid) terminated. Restarting..." -ForegroundColor Yellow
                          $proc = Start-Process powershell.exe `
                              -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$checkpointScript`" -Loop -IntervalSeconds 900" `
                              -WindowStyle Hidden -PassThru
                          $checkpointPid = $proc.Id
                          $restartedCheckpoint = $true
                          Write-Host "Checkpoint process restarted (New PID: $checkpointPid)."
                      } else {
                          Write-Host "ERROR: Checkpoint process died after restart attempt. Checkpoint loop is INACTIVE." -ForegroundColor Red
                      }
                  } else {
                      # Check heartbeat file for honest status reporting
                      if (Test-Path $heartbeatFile) {
                          try {
                              $hb = Get-Content $heartbeatFile -Raw | ConvertFrom-Json
                              Write-Host "  Checkpoint Health: Status=$($hb.Status), LastCompleted=$($hb.RunTime)"
                          } catch {
                              Write-Host "  Checkpoint Health: Process alive (PID $checkpointPid), reading heartbeat failed"
                          }
                      } else {
                          Write-Host "  Checkpoint Health: Process alive (PID $checkpointPid), awaiting first 15m checkpoint cycle"
                      }
                  }
              }

              Start-Sleep -Seconds 300
          }
